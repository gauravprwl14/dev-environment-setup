<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Blog Hero - Cinematic Airport</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background: #000; display: flex; 
            justify-content: center; align-items: center; height: 100vh; overflow: hidden; 
        }
        #hero { 
            width: 1600px; height: 900px; background: #020617; 
            position: relative; overflow: hidden; box-shadow: 0 0 100px #000;
        }
        .floor { 
            position: absolute; bottom: 0; width: 100%; height: 55%; 
            background: linear-gradient(to bottom, #1e293b, #475569 40%, #94a3b8); 
            transform: perspective(1000px) rotateX(45deg); 
        }
        .traveler { 
            position: absolute; left: 50%; top: 75%; transform: translate(-50%, -50%); 
            width: 25px; height: 130px; background: #020617; border-radius: 5px; z-index: 10;
        }
        .traveler::after { 
            content: ''; position: absolute; top: -35px; left: 50%; 
            transform: translateX(-50%); width: 30px; height: 30px; 
            background: #020617; border-radius: 50%; 
        }
        .suitcase { 
            position: absolute; left: 50%; top: 78%; transform: translate(-140%, -50%); 
            width: 120px; height: 140px; background: #0f172a; border-radius: 12px; 
            border: 2px solid #1e293b; z-index: 10;
        }
        .shadow { 
            position: absolute; left: 50%; top: 80%; width: 1500px; height: 200px; 
            background: rgba(0,0,0,0.7); filter: blur(30px); 
            transform: skewX(-60deg) translateX(200px); z-index: 5; 
        }
        .light-spill { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 65%, rgba(251, 191, 36, 0.2), transparent 70%); 
            pointer-events: none; z-index: 15;
        }
        .vignette { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle, transparent 40%, rgba(2, 6, 23, 0.9) 100%); 
            pointer-events: none; z-index: 20;
        }
    </style>
</head>
<body>
    <div id='hero'>
        <div class='floor'></div>
        <div class='shadow'></div>
        <div class='traveler'></div>
        <div class='suitcase'></div>
        <div class='light-spill'></div>
        <div class='vignette'></div>
    </div>
</body>
</html>
